<!DOCTYPE html>
<!--
    =====================================================
    Lenguaje de Marcas - 1º DAW
    Ejercicios Capítulo 8 - HTML
    Ejercicio 3: Formulario "Información del producto"
    Alumno: Juan José Marchena Rubio
    =====================================================
    Idea general:
    - Usamos <fieldset> para agrupar los campos en dos bloques
      (Datos Personales y Datos Económicos) y <legend> para el título
      del bloque, que es la línea con texto que se ve en la imagen.
    - Como hay un campo para subir una foto, el formulario tiene que
      ir con method="post" y enctype="multipart/form-data".
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Información del Producto</title>
</head>
<body>

    <!-- Título principal del formulario -->
    <h3>INFORMACIÓN DEL PRODUCTO</h3>

    <!--
        action: a dónde se envían los datos. El enunciado no dice ningún
                archivo, así que pongo uno de ejemplo.
        method="post": los datos van "dentro" de la petición y no en la URL.
                Es obligatorio cuando se suben archivos (la foto).
        enctype="multipart/form-data": necesario para que el archivo de la
                foto se envíe de verdad. Sin esto solo se enviaría el nombre.
    -->
    <form action="php/producto.php" method="post" enctype="multipart/form-data">

        <!-- ================= BLOQUE 1: DATOS PERSONALES ================= -->
        <fieldset>
            <!-- legend = el texto que aparece "cortando" la línea del recuadro -->
            <legend>Datos Personales</legend>

            <!-- El atributo "for" del label coincide con el "id" del input:
                 así, si haces clic en el texto, se selecciona la caja -->
            <label for="nombre">Nombre:</label><br>
            <!-- size="50" hace la caja más ancha, como en la imagen -->
            <input type="text" id="nombre" name="nombre" size="50">
            <br><br>

            <label for="descripcion">Descripción:</label><br>
            <!-- textarea: caja de texto de varias líneas.
                 rows = filas (alto) y cols = columnas (ancho) -->
            <textarea id="descripcion" name="descripcion" rows="5" cols="40"></textarea>
            <br><br>

            <label for="foto">Foto:</label>
            <!-- type="file" crea el botón "Seleccionar archivo".
                 accept="image/*" hace que solo deje elegir imágenes -->
            <input type="file" id="foto" name="foto" accept="image/*">
            <br><br>

            <!-- Casilla de verificación SIN marcar (en la imagen sale vacía).
                 Si quisiéramos que saliera marcada pondríamos "checked" -->
            <input type="checkbox" id="contador" name="contador" value="si">
            <label for="contador">Añadir contador de visitas</label>
        </fieldset>

        <!-- ================= BLOQUE 2: DATOS ECONÓMICOS ================= -->
        <fieldset>
            <legend>Datos Económicos</legend>

            <label for="precio">Precio:</label>
            <!-- size="4" para que la caja del precio sea pequeñita -->
            <input type="number" id="precio" name="precio" size="4"> &euro;
            <!-- &euro; es la entidad HTML del símbolo € -->

            <!-- &nbsp; son espacios en blanco "duros" para separar un poco -->
            &nbsp;&nbsp;&nbsp;&nbsp;

            <label for="impuestos">Impuestos:</label>
            <!-- select = lista desplegable. Cada <option> es una opción.
                 La primera (4%) sale seleccionada por defecto, como en la imagen -->
            <select id="impuestos" name="impuestos">
                <option value="4" selected>4%</option>
                <option value="7">7%</option>
                <option value="16">16%</option>
                <option value="25">25%</option>
            </select>
            <br><br>

            Promoción:<br>
            <!-- Botones de opción (radio). IMPORTANTE: todos tienen el mismo
                 name="promocion", así el navegador sabe que son del mismo grupo
                 y solo deja marcar UNO. "checked" marca "Ninguno" por defecto -->
            <input type="radio" id="ninguno" name="promocion" value="ninguno" checked>
            <label for="ninguno">Ninguno</label><br>

            <input type="radio" id="transporte" name="promocion" value="transporte">
            <label for="transporte">Transporte Gratuito</label><br>

            <input type="radio" id="descuento" name="promocion" value="descuento10">
            <label for="descuento">Descuento 10%</label>
        </fieldset>

    </form>

</body>
</html>
