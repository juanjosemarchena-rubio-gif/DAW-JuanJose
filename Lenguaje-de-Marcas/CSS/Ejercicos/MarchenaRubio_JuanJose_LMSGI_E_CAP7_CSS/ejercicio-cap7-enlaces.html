<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio de pseudo-clases de enlaces</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <!-- Cada enlace apunta a una dirección distinta: si todos fueran "#",
       al visitar uno el navegador marcaría los cinco como visitados -->
  <p><a href="#enlace1">Enlace número 1</a></p>
  <p><a href="#enlace2">Enlace número 2</a></p>
  <p><a href="#enlace3">Enlace número 3</a></p>
  <p><a href="#enlace4">Enlace número 4</a></p>
  <p><a href="#enlace5">Enlace número 5</a></p>
</body>
</html>
